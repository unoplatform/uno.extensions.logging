trigger:
  branches:
    include:
      - master
      - release/beta/*
      - release/stable/*

pr: 
  branches:
    include:
      - master
      - release/beta/*
      - release/stable/*

variables:
    DotNet.Cli.Telemetry.OptOut: true

jobs:
- job: Packages

  pool:
    vmImage: 'windows-2022'

  workspace:
    clean: all
      
  variables:
    NUGET_PACKAGES: $(build.sourcesdirectory)/.nuget

  strategy:
    matrix:
      OSLog:
        ProjectToBuild: '$(build.sourcesdirectory)/src/Uno.Extensions.Logging.OSLog/Uno.Extensions.Logging.OSLog.csproj'
        Workloads: 'ios tvos maccatalyst macos'

      WebAssembly:
        ProjectToBuild: '$(build.sourcesdirectory)/src/Uno.Extensions.Logging.WebAssembly.Console/Uno.Extensions.Logging.WebAssembly.Console.csproj'
        Workloads: ''

  steps:
  - checkout: self
    clean: true

  - task: gitversion/setup@0
    inputs:
      versionSpec: '5.x'

  - task: gitversion/execute@0
    inputs:
      updateAssemblyInfo: 'False'
      useConfigFile: true
      configFilePath: GitVersion.yml
    displayName: Use GitVersion

  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - powershell: |
      & dotnet workload install $(Workloads)
    displayName: Install .NET Workloads
    condition: and(succeeded(), ne(variables['Workloads'], ''))
    errorActionPreference: stop

  - powershell: |
      & dotnet build "$(ProjectToBuild)" -c Release "-bl:$(build.artifactstagingdirectory)\msbuild.binlog" "-p:PackageOutputPath=$(build.artifactstagingdirectory)\nuget" "-p:PackageVersion=$(GITVERSION.FullSemVer)" "-p:InformationalVersion=$(GITVERSION.InformationalVersion)"
      exit $LASTEXITCODE
    displayName: Build Package
    errorActionPreference: stop

  - task: PowerShell@2
    displayName: Authenticode Sign Packages
    inputs:
      filePath: build/Sign-Package.ps1
    env:
      SignClientUser: $(SignClientUser)
      SignClientSecret: $(SignClientSecret)
      SignPackageName: "Uno.Extensions.Logging"
      SignPackageDescription: "Uno.Extensions.Logging"
      ArtifactDirectory: $(build.artifactstagingdirectory)
    condition: and(succeeded(), not(eq(variables['build.reason'], 'PullRequest')), not(eq(variables['SignClientSecret'], '')), not(eq(variables['SignClientUser'], '')))

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      ArtifactName: $(Build.DefinitionName)
